# Builds the Java core, CLI and web interface and runs their unit tests. The tests that need a live
# besu-pqc-ppi network are skipped here: they run only with -Ddrexsim.rpc=<url> (see README).
name: Java

on:
  push:
    paths:
      - "core/**"
      - "gui/**"
      - "pom.xml"
      - "contracts/build/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "core/**"
      - "gui/**"
      - "pom.xml"
      - "contracts/build/**"
      - ".github/workflows/java.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress package

      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore
          retention-days: 7
