<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PQC Drex Simulator">
  <!-- A "D" holding a lattice: ML-DSA and Falcon, the post-quantum signatures the simulator uses,
       are lattice-based. The highlighted point is the short vector a signer's secret key gives. -->
  <style>
    .line { stroke: #004958; fill: none; }
    .dot { fill: #004958; }
    .key { fill: #F2A900; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #5FA9B6; }
      .dot { fill: #5FA9B6; }
    }
  </style>
  <path class="line" d="M12 9H30A23 23 0 0 1 30 55H12Z" stroke-width="6" stroke-linejoin="round"/>
  <path class="line" d="M22 21H34M28 32H40M22 43H34M22 21L28 32L22 43M34 21L28 32L34 43M34 21L40 32L34 43"
        stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <circle class="dot" cx="22" cy="21" r="2.6"/>
  <circle class="dot" cx="34" cy="21" r="2.6"/>
  <circle class="dot" cx="40" cy="32" r="2.6"/>
  <circle class="dot" cx="22" cy="43" r="2.6"/>
  <circle class="dot" cx="34" cy="43" r="2.6"/>
  <circle class="key" cx="28" cy="32" r="4"/>
</svg>
