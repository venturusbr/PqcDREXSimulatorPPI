<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PQC Drex Simulator">
  <!-- The browser-tab icon. A "D" holding a lattice: ML-DSA and Falcon, the post-quantum signatures the simulator
       uses, are lattice-based. The highlighted point is the short vector a signer's secret key gives. The Deep Blue
       tile keeps it visible on light and dark tab bars, and the mark fills the tile so it stays large in a tab.
       favicon.ico holds renders of this file at 48, 64 and 256 px, and at 16 and 32 px a simpler version without
       the lattice lines and with a thicker "D". The page's header has its own copy without the tile, in index.html. -->
  <rect width="64" height="64" rx="12" fill="#1C0083"/>
  <g transform="translate(32 32) scale(1.1) translate(-32.5 -32)">
    <path d="M12 9H30A23 23 0 0 1 30 55H12Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <path d="M22 21H34M28 32H40M22 43H34M22 21L28 32L22 43M34 21L28 32L34 43M34 21L40 32L34 43"
          fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <g fill="#FFFFFF">
      <circle cx="22" cy="21" r="2.6"/>
      <circle cx="34" cy="21" r="2.6"/>
      <circle cx="40" cy="32" r="2.6"/>
      <circle cx="22" cy="43" r="2.6"/>
      <circle cx="34" cy="43" r="2.6"/>
    </g>
    <circle cx="28" cy="32" r="4.4" fill="#88B9FF"/>
  </g>
</svg>
